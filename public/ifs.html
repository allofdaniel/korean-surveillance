<!DOCTYPE html>
<html lang="ko" class="theme-crt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대한감시 IFS - 관제정보융합지원 시스템 (Information Fusion System)</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scrollbar-width: thin;
      scrollbar-color: var(--outline-light) var(--bg-dim);
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg-dim); }
    ::-webkit-scrollbar-thumb { background: var(--outline-light); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary-soft); }
    
    /* 1. Base Theme: Tactical CRT Green (Default) */
    :root, html.theme-crt {
      --bg: #111111;
      --bg-dim: #0a0a0a;
      --surface-container: #181818;
      --surface-high: #242424;
      --outline: #2d3d28;
      --outline-light: #44593c;
      --primary: #00ff00;
      --primary-dim: #02e600;
      --primary-bright: #77ff61;
      --primary-soft: #a8be9e;
      --amber: #ffba20;
      --amber-dim: #d97706;
      --red: #ff5252;
      --text-muted: #72846b;
      --font-mono: 'JetBrains Mono', Consolas, Monaco, monospace;
    }

    /* 2. Theme: Dark Mono White (검은 배경에 흰색 글씨 모드) */
    html.theme-mono {
      --bg: #09090b;
      --bg-dim: #000000;
      --surface-container: #18181b;
      --surface-high: #27272a;
      --outline: #3f3f46;
      --outline-light: #52525b;
      --primary: #ffffff;
      --primary-dim: #f4f4f5;
      --primary-bright: #ffffff;
      --primary-soft: #e4e4e7;
      --amber: #fbbf24;
      --amber-dim: #d97706;
      --red: #f87171;
      --text-muted: #a1a1aa;
    }

    /* 3. Theme: Deep Navy Blue (진한 파란 배경 모드 - VS Code Dark+ / ATC Oceanic) */
    html.theme-navy {
      --bg: #0b1329;
      --bg-dim: #060b18;
      --surface-container: #132247;
      --surface-high: #1c3266;
      --outline: #223e7c;
      --outline-light: #3056a8;
      --primary: #38bdf8;
      --primary-dim: #0ea5e9;
      --primary-bright: #7dd3fc;
      --primary-soft: #bae6fd;
      --amber: #fbbf24;
      --amber-dim: #d97706;
      --red: #f87171;
      --text-muted: #64748b;
    }

    /* 4. Theme: Daylight Radar (라이트 모드) */
    html.theme-light {
      --bg: #f4f4f5;
      --bg-dim: #e4e4e7;
      --surface-container: #ffffff;
      --surface-high: #d4d4d8;
      --outline: #a1a1aa;
      --outline-light: #71717a;
      --primary: #16a34a;
      --primary-dim: #15803d;
      --primary-bright: #059669;
      --primary-soft: #27272a;
      --amber: #b45309;
      --amber-dim: #78350f;
      --red: #dc2626;
      --text-muted: #52525b;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--primary-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.2;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      transition: background 0.2s, color 0.2s;
    }

    /* CRT Scanlines Overlay */
    .scanlines {
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(0, 255, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.02));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      z-index: 99;
      opacity: 0.4;
    }
    .scanlines.hidden { display: none; }

    /* Compact Grid & Boxes */
    .grid-box { border: 1px solid var(--outline); background: var(--bg); display: flex; flex-direction: column; }
    .grid-header {
      background: var(--surface-high);
      border-bottom: 1px solid var(--outline);
      padding: 1px 6px;
      font-size: 9px;
      font-weight: 700;
      color: var(--primary-soft);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 18px;
      flex-shrink: 0;
    }
    .grid-header-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .b-r { border-right: 1px solid var(--outline); }
    .b-b { border-bottom: 1px solid var(--outline); }

    /* Section Spinner */
    .section-spinner {
      width: 9px;
      height: 9px;
      border: 1.5px solid rgba(0, 255, 0, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }
    .section-spinner.active { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Ultra-Compact Top Nav Bar */
    header {
      height: 30px;
      background: var(--bg-dim);
      border-bottom: 1px solid var(--outline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      z-index: 50;
      flex-shrink: 0;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-title {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--primary-bright);
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ke-logo {
      height: 14px;
      width: auto;
      object-fit: contain;
      vertical-align: middle;
      display: inline-block;
    }
    .airport-select {
      background: var(--bg-dim);
      border: 1px solid var(--outline-light);
      color: var(--amber);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 1.5px 5px;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 9.5px;
      font-weight: 700;
      color: var(--primary-soft);
    }
    .btn-settings {
      background: var(--surface-container);
      border: 1px solid var(--outline);
      color: var(--primary-soft);
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 700;
      padding: 1.5px 6px;
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      transition: all 0.15s;
    }
    .btn-settings:hover { border-color: var(--primary); color: var(--primary-bright); }

    .dot-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 6px var(--primary);
      animation: beat 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }
    .dot-amber {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 6px var(--amber);
      animation: beat 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }
    @keyframes beat {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    /* Main Layout */
    main {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 30px);
      padding: 3px;
      gap: 3px;
      overflow: hidden;
    }

    /* Weather Mode Selector Buttons */
    .wind-mode-group {
      display: flex;
      gap: 3px;
      align-items: center;
    }
    .wind-mode-btn {
      background: var(--surface-container);
      border: 1px solid var(--outline);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 8.5px;
      font-weight: 700;
      padding: 0.5px 5px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .wind-mode-btn:hover { border-color: var(--primary); color: var(--primary-bright); }
    .wind-mode-btn.active {
      background: rgba(0, 255, 0, 0.18);
      border-color: var(--primary);
      color: var(--primary-bright);
    }
    html.theme-mono .wind-mode-btn.active { background: rgba(255, 255, 255, 0.2); }
    html.theme-navy .wind-mode-btn.active { background: rgba(56, 189, 248, 0.25); }
    html.theme-light .wind-mode-btn.active { background: rgba(22, 163, 74, 0.2); }

    /* Section 1: Weather Grid */
    .weather-grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      background: var(--bg-dim);
      flex-shrink: 0;
      padding: 0;
    }
    .weather-grid-container.dense {
      grid-template-columns: repeat(4, 1fr);
    }
    .weather-grid-container.single {
      grid-template-columns: 1fr;
    }
    .rwy-card {
      border: 1px solid var(--outline);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      border-radius: 2px;
    }
    .rwy-card.active-use {
      border-color: var(--primary);
      box-shadow: inset 0 0 8px rgba(0, 255, 0, 0.08);
    }

    /* Top Split: Left (Title + Wind Metrics) vs Right (Wind Indicator) */
    .rwy-top-split {
      display: flex;
      width: 100%;
      min-height: 52px;
    }
    .rwy-top-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      justify-content: space-between;
    }
    .rwy-title-bar {
      background: var(--surface-container);
      padding: 1px 6px;
      font-size: 9px;
      font-weight: 800;
      color: var(--amber);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 18px;
    }
    .use-tag {
      font-size: 7.5px;
      background: var(--primary);
      color: #000;
      padding: 0.5px 4px;
      border-radius: 2px;
      font-weight: 800;
      letter-spacing: 0.03em;
    }
    html.theme-mono .use-tag { color: #000; }
    html.theme-light .use-tag { color: #fff; }

    /* Wind Rose & Vectors on Right side */
    .rwy-top-right {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 2px 6px;
      background: var(--bg-dim);
      flex-shrink: 0;
      border-left: 1px solid var(--outline);
    }
    .vector-display {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      min-width: 48px;
    }
    .vector-item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 4px;
    }
    .v-label {
      font-size: 8px;
      color: var(--text-muted);
      font-weight: 700;
      white-space: nowrap;
    }
    .v-val {
      font-size: 11px;
      font-weight: 800;
      color: var(--primary-bright);
      font-family: var(--font-mono);
      white-space: nowrap;
    }

    .metric-row {
      display: flex;
      width: 100%;
      align-items: center;
    }
    .metric-col {
      flex: 1;
      padding: 1px 2px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      overflow: hidden;
    }
    .metric-label {
      font-size: 7.5px;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
    }
    .metric-val {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary-bright);
      line-height: 1.1;
      white-space: nowrap;
      letter-spacing: -0.02em;
    }
    .metric-val-md {
      font-size: 11px;
      font-weight: 800;
      color: var(--primary-bright);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.15;
    }

    /* Bottom Split: Atmospheric & Environmental Metrics */
    .rwy-bottom-split {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-top: 1px solid var(--outline);
    }
    .env-row {
      display: flex;
      width: 100%;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    html.theme-light .env-row {
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
    }
    .env-row:last-child {
      border-bottom: none;
    }
    .env-col {
      flex: 1;
      padding: 2px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-width: 0;
      font-size: 8.5px;
    }
    .env-col.b-r {
      border-right: 1px solid var(--outline);
    }
    .env-label {
      color: var(--text-muted);
      font-weight: 700;
      white-space: nowrap;
      font-size: 8px;
    }
    .env-val {
      color: var(--primary-bright);
      font-weight: 800;
      white-space: nowrap;
      font-family: var(--font-mono);
      font-size: 8.5px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Section 2: Raw MET Feed with Warnings & SIGMET */
    .raw-met-box {
      background: var(--bg-dim);
      padding: 6px 10px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--primary-dim);
      display: flex;
      flex-direction: column;
      gap: 3.5px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--outline);
      min-height: 48px;
      font-weight: 600;
      font-family: 'Consolas', 'Courier New', monospace, var(--font-mono);
      letter-spacing: 0.3px;
    }
    .raw-met-line { display: flex; align-items: baseline; gap: 0; word-break: break-all; }
    .raw-sigmet-text { color: var(--amber); font-weight: 800; }
    .raw-warning-text { color: var(--red); font-weight: 800; }

    /* Section 3: Middle Split Schedule Tables (DEP / ARR - Clickable Sort Columns) */
    .schedule-split {
      flex: 1;
      display: flex;
      gap: 3px;
      min-height: 0;
    }
    .schedule-table-wrap {
      flex: 1;
      background: var(--bg-dim);
      overflow-y: auto;
      overflow-x: auto;
      scroll-behavior: smooth;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 10px;
      white-space: nowrap;
    }
    thead { position: sticky; top: 0; background: var(--surface-container); z-index: 10; border-bottom: 1px solid var(--outline); }
    th {
      padding: 2.5px 3px;
      font-size: 8px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: color 0.15s, background 0.15s;
    }
    th:hover {
      color: var(--primary-bright);
      background: var(--surface-high);
    }
    th.sorted-asc::after { content: ' ▲'; color: var(--primary); font-size: 7.5px; }
    th.sorted-desc::after { content: ' ▼'; color: var(--primary); font-size: 7.5px; }

    td { padding: 2px 3px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); vertical-align: middle; text-align: center; }
    html.theme-light td { border-bottom: 1px solid rgba(0, 0, 0, 0.05); }
    
    /* High Contrast Schedule Styling (Completed vs Upcoming) */
    tr.flight-completed {
      opacity: 0.5;
      color: var(--text-muted);
    }
    tr.flight-completed td {
      color: var(--text-muted) !important;
    }
    tr.flight-completed .badge-rule {
      opacity: 0.6;
    }

    /* Unfiled Pending Slot Rows (Greyed Out) */
    tr.flight-unfiled {
      opacity: 0.35 !important;
      color: var(--text-muted) !important;
    }
    tr.flight-unfiled td {
      color: var(--text-muted) !important;
    }
    tr.flight-unfiled .badge-rule {
      opacity: 0.4;
    }
    .fpl-tag-y { color: var(--primary); font-weight: 800; }
    .fpl-tag-n { color: var(--text-muted); font-weight: 700; }

    tr.flight-upcoming {
      opacity: 1;
      font-weight: 700;
    }
    tr.flight-upcoming td.flight-id-cell {
      color: var(--primary-bright) !important;
      font-weight: 800;
    }
    tr.flight-upcoming td.flight-time-cell {
      color: #fff !important;
    }
    html.theme-light tr.flight-upcoming td.flight-time-cell {
      color: #000 !important;
    }

    tr:hover { background: rgba(255, 255, 255, 0.06); }
    html.theme-light tr:hover { background: rgba(0, 0, 0, 0.04); }
    
    .status-dep { color: var(--primary-soft); font-weight: 700; }
    .status-arr { color: var(--primary-soft); font-weight: 700; }
    .status-sch { color: var(--amber); font-weight: 800; }
    .status-enr { color: var(--amber); font-weight: 800; }
    .status-cnl { color: var(--red); font-weight: 800; }
    .status-dla { color: var(--amber); font-weight: 800; }
    .status-lnd { color: var(--primary-bright); font-weight: 800; }

    /* IFR / VFR Flight Rules Badges */
    .badge-rule {
      font-size: 7.5px;
      padding: 0.5px 3.5px;
      border-radius: 2px;
      font-weight: 800;
      margin-right: 4px;
      display: inline-block;
    }
    .badge-ifr {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .badge-vfr {
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    .flight-callsign {
      letter-spacing: 0.03em;
    }

    /* 5-Time Blinking Animation on Real Status Change */
    .blink-status-5 {
      animation: statusFlash5 3.5s ease-in-out;
    }
    @keyframes statusFlash5 {
      0%, 20%, 40%, 60%, 80%, 100% {
        background-color: transparent;
        color: var(--primary-bright);
        box-shadow: none;
      }
      10%, 30%, 50%, 70%, 90% {
        background-color: rgba(0, 255, 0, 0.35);
        color: #fff;
        box-shadow: 0 0 8px var(--primary);
      }
    }

    /* Section 4: Bottom Clocks & Editable Airport Notices */
    .bottom-bar {
      min-height: 84px;
      display: flex;
      gap: 3px;
      flex-shrink: 0;
    }
    .clock-box {
      width: 210px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 8px;
      background: var(--bg-dim);
      flex-shrink: 0;
    }
    .clock-row-item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      width: 100%;
      padding: 0 4px;
    }
    .clock-tag {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }
    .clock-digits-unified {
      font-size: 24px;
      font-weight: 900;
      color: var(--primary-bright);
      letter-spacing: 0.05em;
      line-height: 1;
    }

    .notices-box {
      flex: 1;
      background: var(--bg-dim);
      display: flex;
      flex-direction: column;
    }
    .notices-header-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .btn-save-notice {
      background: rgba(0, 255, 0, 0.15);
      border: 1px solid var(--primary);
      color: var(--primary-bright);
      font-size: 9px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 2px;
      cursor: pointer;
      font-family: var(--font-mono);
      transition: all 0.15s;
    }
    .btn-save-notice:hover {
      background: var(--primary);
      color: #000;
    }
    .notices-textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--primary-soft);
      font-family: var(--font-mono);
      font-size: 15px;
      padding: 5px 8px;
      resize: vertical;
      min-height: 60px;
      outline: none;
      line-height: 1.45;
      font-weight: 600;
    }
    .notices-textarea:focus {
      background: rgba(0, 0, 0, 0.2);
    }

    /* Settings Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      background: var(--surface-container);
      border: 1px solid var(--outline-light);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
      width: 360px;
      border-radius: 3px;
      overflow: hidden;
      font-family: var(--font-mono);
    }
    .modal-header {
      background: var(--surface-high);
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 800;
      color: var(--primary-bright);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--outline);
    }
    .modal-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .modal-label {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--primary-soft);
    }

</head>

  <!-- Settings & Theme Modal -->

            <option value="true">ON (클래식 CRT 스캔라인)</option>

        <button class="btn-modal-action btn-modal-save" onclick="applyAndSaveSettings()">저장 및 적용</button>
      </div>

  <script>
    // IFS Terminal Engine - Consumes 100% Data via Gateway APIs
    const API_BASE = window.location.origin;
    let currentAirport = 'RKJY';
    let rawRunwaysData = [];
    let windMode = '2min'; // '2min' (자방위) or '10min' (진방위)
    let showWindDecimal = true; // Wind speed decimal on/off
    let hasAutoScrolledSchedule = false;

    // In-memory active flight list for sorting
    let loadedDeps = [];
    let loadedArrs = [];

    // Sorting state
    const currentSort = {
      dep: { col: 'etd', asc: true },
      arr: { col: 'eta', asc: true }
    };
    
    // Persistent Status History for Real State Change Detection
    const flightStatusHistory = new Map();

    // Default Airport Directives Dictionary
    const DEFAULT_AIRPORT_NOTICES = {
      RKJY: "1. [RKJY] 여수공항 활주로 17/35 표준 운항 절차 유지 중.\n2. [NOTAM] 유효 비행고시보 및 시정 10,000m 정상 운영.",
      RKSI: "1. [RKSI] 인천국제공항 4본 활주로 (15/33, 16/34) 실시간 기상 연계 중.\n2. [EFS] 전자비행스트립 연계 대기 상태 유지.",
      RKSS: "1. [RKSS] 김포국제공항 14/32 평행 활주로 정상 운용.\n2. [NOTAM] 소음 저감 절차 및 표준 출발/도착 경로 준수.",
      RKPC: "1. [RKPC] 제주국제공항 07/25 주 활주로 및 13/31 횡선 활주로 감시 중.",
      RKPK: "1. [RKPK] 김해국제공항 18/36 활주로 CIRCLING 접근 절차 주의.",
      RKTL: "1. [RKTL] 울진비행장 비행교육원 훈련기 VFR 교통 집중 (CIRCUIT / LOCAL).\n2. [ATC] IFR 민항기 접근 시 VFR 훈련기 장주 분리 철저.",
      RKPD: "1. [RKPD] 정석비행장 대한항공 비행훈련원 전용 훈련 공역 운용 중.\n2. [ATC] 01 활주로 훈련기 터치앤고(Touch & Go) 절차 준수."
    };

    // 1. Clocks Ticker
    function updateClocks() {
      const now = new Date();
      const utcHours = String(now.getUTCHours()).padStart(2, '0');
      const utcMins = String(now.getUTCMinutes()).padStart(2, '0');
      const utcSecs = String(now.getUTCSeconds()).padStart(2, '0');
      document.getElementById('clock-utc').textContent = `${utcHours}:${utcMins}:${utcSecs}`;

      const kstHours = String(now.getHours()).padStart(2, '0');
      const kstMins = String(now.getMinutes()).padStart(2, '0');
      const kstSecs = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock-kst').textContent = `${kstHours}:${kstMins}:${kstSecs}`;
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    // 2. Theme & Settings Management (LocalStorage Persistence per user)
    let selectedModalThemeName = 'theme-crt';

    function initThemeSettings() {
      const savedTheme = localStorage.getItem('ifs_theme') || 'theme-crt';
      const savedScanlines = localStorage.getItem('ifs_scanlines') !== 'false';
      const savedDecimal = localStorage.getItem('ifs_wind_decimal') !== 'false';

      applyTheme(savedTheme);
      setScanlines(savedScanlines);
      showWindDecimal = savedDecimal;
      updateDecimalButton();
    }

    function applyTheme(themeName) {
      document.documentElement.className = themeName;
      localStorage.setItem('ifs_theme', themeName);

      const keLogo = document.getElementById('ke-logo');
      if (keLogo) {
        if (themeName === 'theme-light') {
          keLogo.src = '/assets/logos/KE_primary-logo_dark-blue_online.svg';
        } else {
          keLogo.src = '/assets/logos/KE_primary-logo_white_online.svg';
        }
      }
    }

    function setScanlines(show) {
      const overlay = document.getElementById('scanlines-overlay');
      if (overlay) overlay.classList.toggle('hidden', !show);
      localStorage.setItem('ifs_scanlines', show ? 'true' : 'false');
    }

    function openSettingsModal() {
      const currentTheme = localStorage.getItem('ifs_theme') || 'theme-crt';
      selectModalTheme(currentTheme);
      document.getElementById('setting-scanlines').value = localStorage.getItem('ifs_scanlines') !== 'false' ? 'true' : 'false';
      document.getElementById('settings-modal').classList.add('open');
    }

    function closeSettingsModal() {
      document.getElementById('settings-modal').classList.remove('open');
    }

    function selectModalTheme(themeName) {
      selectedModalThemeName = themeName;
      ['crt', 'mono', 'navy', 'light'].forEach(t => {
        const btn = document.getElementById(`tbtn-${t}`);
        if (btn) btn.classList.toggle('active', `theme-${t}` === themeName);
      });
    }

    function applyAndSaveSettings() {
      applyTheme(selectedModalThemeName);
      const scanlinesVal = document.getElementById('setting-scanlines').value === 'true';
      setScanlines(scanlinesVal);
      closeSettingsModal();
    }

    // 3. Exact Runway Heading Calculation
    function getRunwayHeading(rwyDirStr) {
      const numMatch = (rwyDirStr || '').match(/\d+/);
      const num = numMatch ? parseInt(numMatch[0]) : 17;
      return num * 10;
    }

    function getOppositeRunway(rwyDirStr) {
      const numMatch = (rwyDirStr || '').match(/\d+/);
      const num = numMatch ? parseInt(numMatch[0]) : 17;
      const oppNum = (num + 18) % 36 || 36;
      const isL = (rwyDirStr || '').includes('L');
      const isR = (rwyDirStr || '').includes('R');
      const oppSuffix = isL ? 'R' : isR ? 'L' : '';
      return `${String(oppNum).padStart(2, '0')}${oppSuffix}`;
    }

    // 4. Headwind & Crosswind Vector Calculator
    function calculateWindVectors(windDirDeg, windSpeedKts, rwyHeadingDeg) {
      if (isNaN(windDirDeg) || isNaN(windSpeedKts)) {
        return { headTail: '-', cross: '-', headwindStr: '-', crosswindStr: '-' };
      }
      const angleRad = ((windDirDeg - rwyHeadingDeg) * Math.PI) / 180;
      const headwind = Math.round(windSpeedKts * Math.cos(angleRad));
      const crosswind = Math.round(windSpeedKts * Math.sin(angleRad));

      const headTailStr = headwind >= 0 ? `H${headwind}` : `T${Math.abs(headwind)}`;
      const crossStr = crosswind >= 0 ? `R${crosswind}` : `L${Math.abs(crosswind)}`;
      return { headTail: headTailStr, cross: crossStr, headwindStr: headTailStr, crosswindStr: crossStr };
    }

    // Relative Humidity Calculator (Magnus-Tetens)
    function calculateHumidity(tmpC, dpC) {
      const t = parseFloat(tmpC);
      const dp = parseFloat(dpC);
      if (isNaN(t) || isNaN(dp)) return '75%';
      const rh = Math.min(100, Math.max(10, Math.round(100 * Math.exp((17.625 * dp) / (243.04 + dp)) / Math.exp((17.625 * t) / (243.04 + t)))));
      return `${rh}%`;
    }

    // Statute Miles (SM) Conversion for Aviation Visibility (7 SM for >=10,000m Clear)
    function formatVisibility(morMeters) {
      const mor = parseFloat(morMeters);
      if (isNaN(mor) || mor <= 0 || mor >= 10000) return '10,000m (7 SM)';
      
      let smStr = '';
      if (mor >= 9600) smStr = '6 SM';
      else if (mor >= 8000) smStr = '5 SM';
      else if (mor >= 6400) smStr = '4 SM';
      else if (mor >= 4800) smStr = '3 SM';
      else if (mor >= 3200) smStr = '2 SM';
      else if (mor >= 1600) smStr = '1 SM';
      else if (mor >= 800) smStr = '1/2 SM';
      else if (mor >= 400) smStr = '1/4 SM';
      else smStr = '<1/4 SM';

      const mStr = `${Math.round(mor).toLocaleString()}m`;
      return `${mStr} (${smStr})`;
    }

    // 5. Render Custom SVG Wind Rose & Runway Graphic
    function createRunwayRoseSvg(rwyDirStr, rwyHeadingDeg, windDirDeg, isActiveRwy) {
      const numMatch = rwyDirStr.match(/\d+/);
      const num = numMatch ? parseInt(numMatch[0]) : 17;
      const oppNum = (num + 18) % 36 || 36;
      
      const isL = rwyDirStr.includes('L');
      const isR = rwyDirStr.includes('R');
      const suffix = isL ? 'L' : isR ? 'R' : '';
      const oppSuffix = isL ? 'R' : isR ? 'L' : '';

      const topLabel = `${String(num).padStart(2, '0')}${suffix}`;
      const botLabel = `${String(oppNum).padStart(2, '0')}${oppSuffix}`;

      // Runway tilt relative to North (0 deg)
      const rwyTilt = rwyHeadingDeg - 180;

      // In-Use: Bright Solid White #ffffff | Non-In-Use: Subtle Tactical Gray #71717a
      const planeFill = isActiveRwy ? '#ffffff' : '#71717a';
      const planeOpacity = isActiveRwy ? '1' : '0.65';

      const airplaneSvg = `
        <g class="airplane-icon" transform="translate(0, -19) rotate(180)" opacity="${planeOpacity}">
          <path d="M0,-6 L1.8,-2 L5,-0.6 L5,0.6 L1.8,0 L1,4 L3,6 L3,6.8 L0,6 L-3,6.8 L-3,6 L-1,4 L-1.8,0 L-5,0.6 L-5,-0.6 L-1.8,-2 Z" fill="${planeFill}" stroke="${isActiveRwy ? '#ffffff' : 'none'}" stroke-width="0.3" />
        </g>
      `;

      return `
        <svg viewBox="-50 -50 100 100" width="50" height="50" class="runway-rose-svg">
          <!-- Compass Circle -->
          <circle cx="0" cy="0" r="36" stroke="var(--primary)" stroke-width="1.6" fill="none" />

    // 6. Fetch AMOS & Weather Data via API (Single-request RAW_ALL & Stable Diff Rendering)
    async function syncWeatherData(isManual = false) {
      const spin = document.getElementById('spin-wx');
      const spinMet = document.getElementById('spin-met');
      if (isManual) {
        if (spin) spin.classList.add('active');
        if (spinMet) spinMet.classList.add('active');
      }

      try {
        const res = await fetch(`${API_BASE}/api/weather?type=amos&icao=${currentAirport}&_t=${Date.now()}`);
        if (res.ok) {
          const data = await res.json();
          rawRunwaysData = Array.isArray(data) ? data : [];
        } else {
          rawRunwaysData = [];
        }
      } catch (e) {
        console.warn('Weather sync error:', e.message);
      }

      renderRunwaysGrid();
      if (spin) spin.classList.remove('active');

      // Fetch MET REPORT, METAR, TAF, SIGMET & WARNINGS via SINGLE RAW_ALL endpoint
      try {
        const [rawAllRes, sigmetRes] = await Promise.all([
          fetch(`${API_BASE}/api/amhs?type=RAW_ALL&icao=${currentAirport}&_t=${Date.now()}`),
          fetch(`${API_BASE}/api/amhs?type=SIGMET&raw=true&icao=${currentAirport}&_t=${Date.now()}`).catch(() => null)
        ]);

        const elMetReport = document.getElementById('raw-met-report');
        const elMetar = document.getElementById('raw-metar');
        const elTaf = document.getElementById('raw-taf');
        const elSigmet = document.getElementById('raw-sigmet');
        const elWarn = document.getElementById('raw-warning');

        if (rawAllRes && rawAllRes.ok) {
          const data = await rawAllRes.json();
          
          // 1. MET REPORT
          const repTxt = (data.metReport || '').replace(/\r?\n|\r/g, ' ').replace(/\s+/g, ' ').trim();
          if (elMetReport) {
            if (repTxt && !repTxt.includes('<')) {
              elMetReport.textContent = repTxt;
              document.getElementById('line-met-report').style.display = 'flex';
            }
          }

          // 2. METAR / SPECI
          const metarTxt = (data.speci || data.metar || '').replace(/\r?\n|\r/g, ' ').replace(/\s+/g, ' ').trim();
          if (elMetar) {
            if (metarTxt && !metarTxt.includes('<')) {
              elMetar.textContent = metarTxt;
              document.getElementById('line-metar').style.display = 'flex';
            }
          }

          // 3. TAF
          const tafTxt = (data.taf || '').replace(/\r?\n|\r/g, ' ').replace(/\s+/g, ' ').trim();
          if (elTaf) {
            if (tafTxt && !tafTxt.includes('<')) {
              elTaf.textContent = tafTxt;
              document.getElementById('line-taf').style.display = 'flex';
            }
          }

          // 4. WARNINGS
          const warnList = data.warnings || [];
          if (elWarn) {
            if (warnList.length > 0) {
              const wTxt = warnList[0].warningText || warnList[0].title || '';
              elWarn.textContent = `WARNING: ${wTxt}`;
              document.getElementById('line-warning').style.display = 'flex';
            }
          }
        }

        // 5. SIGMET
        if (sigmetRes && sigmetRes.ok) {
          const sData = await sigmetRes.json();
          const sTxt = (sData.rawSigmetText || sData.rawAviationWeatherText || '').replace(/\r?\n|\r/g, ' ').replace(/\s+/g, ' ').trim();
          if (elSigmet && sTxt && !sTxt.includes('<')) {
            elSigmet.textContent = `SIGMET: ${sTxt}`;
            document.getElementById('line-sigmet').style.display = 'flex';
          }
        }
      } catch (e) {
        console.warn('RAW MET sync error:', e);
      }
      
      if (spinMet) spinMet.classList.remove('active');
    }

    function updateDecimalButton() {
      const btn = document.getElementById('btn-wind-round');
      if (btn) {

    function renderRunwaysGrid() {
      const container = document.getElementById('weather-runways-container');
      if (!container) return;

      if (!rawRunwaysData || rawRunwaysData.length === 0) {
        container.className = 'weather-grid-container single';
        container.innerHTML = `
          <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; color: var(--primary-dim); font-size: 13px; font-weight: 600; background: var(--bg-dim); border: 1px solid var(--outline);">
            [${currentAirport}] 대한민국 항공기상청(AMO) AMOS 관제기상 관측소 미설치 (기상 관측 데이터 없음)
          </div>
        `;
        return;
      }

      let displayRunways = rawRunwaysData;
      if (displayRunways.length === 1) {
        container.className = 'weather-grid-container single';
      } else if (displayRunways.length >= 6) {
        container.className = 'weather-grid-container dense';
      } else {
        container.className = 'weather-grid-container';
      }

      container.innerHTML = '';

      displayRunways.forEach((rwy, idx) => {
        const rwyDirStr = rwy.rwyDir || '01';
        const rwyHeading = getRunwayHeading(rwyDirStr);
        
        // Use 2-min MAG or 10-min TRUE
        const is10Min = windMode === '10min';
        const rawWd = parseInt(is10Min ? (rwy.wd10minAvg || rwy.wd) : (rwy.wd2minAvg || rwy.wd)) || 0;
        const rawWs = parseFloat(is10Min ? (rwy.wspd10minAvg || rwy.ws) : (rwy.wspd2minAvg || rwy.ws)) || 0;
        const rawMaxWs = parseFloat(is10Min ? (rwy.wspd10minMax || rwy.max) : (rwy.wspd2minMax || rwy.max)) || rawWs;
        const rawMinWs = parseFloat(rwy.min) || Math.max(0, parseFloat((rawWs - 2).toFixed(1)));
        
        // Format according to decimal toggle
        const wd = rawWd;
        const ws = showWindDecimal ? rawWs : Math.round(rawWs);
        const maxWs = showWindDecimal ? rawMaxWs : Math.round(rawMaxWs);
        const minWs = showWindDecimal ? rawMinWs : Math.round(rawMinWs);
        const gust = rwy.gust && rwy.gust !== '-' ? (showWindDecimal ? rwy.gust : Math.round(parseFloat(rwy.gust))) : '-';
        
        // Temperature, Dewpoint, Humidity (Clean bold metrics)
        const tmpNum = rwy.tmp !== undefined && rwy.tmp !== '' && rwy.tmp !== '-' ? parseFloat(rwy.tmp).toFixed(1) : '-';
        const dpNum = rwy.dp !== undefined && rwy.dp !== '' && rwy.dp !== '-' ? parseFloat(rwy.dp).toFixed(1) : '-';
        const humidity = rwy.hm !== undefined && rwy.hm !== '' && rwy.hm !== '-' ? `${rwy.hm}%` : (tmpNum !== '-' && dpNum !== '-' ? calculateHumidity(rwy.tmp, rwy.dp) : '-');
        const tmpDpHum = `${tmpNum}/${dpNum}(${humidity})`;

        let cldBase = rwy.base1lyr || rwy.cld || '-';
        if (cldBase === 'NCD') cldBase = 'NCD';
        else if (/^\d+$/.test(cldBase)) cldBase = `FEW ${cldBase}FT`;

        // Precipitation & Weather Present
        const rn = rwy.rn1hr || rwy.rn1min || '0.0';
        const ww = rwy.wwLttr || rwy.ww || '-';
        const precipDisplay = `${rn}mm (${ww})`;

        // Strict positive QNH calculation
        const rawQnh = parseFloat(rwy.qnhHpa || (rwy.qnhOrigin ? (rwy.qnhOrigin / 10) : (parseFloat(rwy.qnh) > 500 ? rwy.qnh : 1013)));
        const qnhVal = (!isNaN(rawQnh) && rawQnh > 800) ? Math.round(rawQnh) : 1013;
        const qnhInhgVal = (qnhVal * 0.02953).toFixed(2);
        const qnhDisplay = `${qnhVal}/${qnhInhgVal}`;
        
        // Visibility (시정 in m & Statute Miles SM) & RVR
        const morRaw = rwy.mor1min || rwy.mor || '10000';
        const visFormatted = formatVisibility(morRaw);
        const rvrRaw = rwy.rvr1min || rwy.rvr || 'P2000';
        const rvrDisplay = `${visFormatted} / ${rvrRaw}`;

        const vectors = calculateWindVectors(wd, rawWs, rwyHeading);
        
        // Only active runway direction
        const isActive = (rwy.rwyUse === 'Y');

        const rwyEl = document.createElement('div');
        rwyEl.className = `rwy-card ${isActive ? 'active-use' : ''}`;
        
        // High-legibility controller-centric metrics (Large digits, small labels)
        rwyEl.innerHTML = `
          <div class="rwy-top-split">
            <div class="rwy-top-left">
              <div class="rwy-title-bar b-b">
                <span>RWY ${rwyDirStr} WIND DATA</span>
                ${isActive ? '<span class="use-tag">IN-USE</span>' : ''}
              </div>
              <div class="metric-row b-b">
                <div class="metric-col b-r"><span class="metric-label">풍향(°)</span></div>
                <div class="metric-col b-r"><span class="metric-label">평균(kt)</span></div>
                <div class="metric-col b-r"><span class="metric-label">최저(kt)</span></div>
                <div class="metric-col b-r"><span class="metric-label">최대(kt)</span></div>
                <div class="metric-col"><span class="metric-label">돌풍(kt)</span></div>
              </div>
              <div class="metric-row">
                <div class="metric-col b-r"><span class="metric-val">${String(wd).padStart(3, '0')}</span></div>
                <div class="metric-col b-r"><span class="metric-val">${ws}</span></div>
                <div class="metric-col b-r"><span class="metric-val">${minWs}</span></div>
                <div class="metric-col b-r"><span class="metric-val">${maxWs}</span></div>
                <div class="metric-col"><span class="metric-val" style="color: var(--primary-soft);">${gust}</span></div>
              </div>
            </div>
            <div class="rwy-top-right">
              ${createRunwayRoseSvg(rwyDirStr, rwyHeading, wd, isActive)}
              <div class="vector-display">
                <div class="vector-item"><span class="v-label">정풍/배풍</span><span class="v-val">${vectors.headTail}</span></div>
                <div class="vector-item"><span class="v-label">좌/우측풍</span><span class="v-val">${vectors.cross}</span></div>
              </div>
            </div>
          </div>
          <div class="rwy-bottom-split">
            <div class="env-row">
              <div class="env-col b-r"><span class="env-label">기온/노점(습도)</span><span class="env-val">${tmpDpHum}</span></div>
              <div class="env-col"><span class="env-label">QNH</span><span class="env-val">${qnhDisplay}</span></div>
            </div>
            <div class="env-row">
              <div class="env-col b-r"><span class="env-label">운고 / 운량</span><span class="env-val">${cldBase}</span></div>
              <div class="env-col"><span class="env-label">강수량 / 일기</span><span class="env-val">${precipDisplay}</span></div>
            </div>
            <div class="env-row">

    // 7. Interactive Column Sorting Engine
    function sortTable(tableType, colKey) {
      if (currentSort[tableType].col === colKey) {
        currentSort[tableType].asc = !currentSort[tableType].asc;
      } else {
        currentSort[tableType].col = colKey;
        currentSort[tableType].asc = true;
      }
      renderScheduleTable(tableType);
    }

    function updateSortHeaderIcons(tableType) {
      const { col, asc } = currentSort[tableType];
      const cols = tableType === 'dep' 
        ? ['flt', 'typ', 'reg', 'nat', 'fpl', 'des', 'spt', 'ram', 'etd', 'atd', 'eta', 'cha']
        : ['flt', 'typ', 'reg', 'sts', 'nat', 'fpl', 'org', 'spt', 'ram', 'etd', 'eta', 'ata', 'cha'];

      cols.forEach(c => {
        const th = document.getElementById(`th-${tableType}-${c}`);
        if (th) {
          th.classList.remove('sorted-asc', 'sorted-desc');
          if (c === col) {
            th.classList.add(asc ? 'sorted-asc' : 'sorted-desc');
          }
        }
      });
    }

    function sortFlightList(list, colKey, asc) {
      return [...list].sort((a, b) => {
        let valA = a[colKey] || '';
        let valB = b[colKey] || '';

        // If numeric/time field
        const numA = parseInt(String(valA).replace(/[^0-9]/g, ''));
        const numB = parseInt(String(valB).replace(/[^0-9]/g, ''));

        if (!isNaN(numA) && !isNaN(numB) && ['spt', 'ram', 'std', 'etd', 'atd', 'sta', 'eta', 'ata'].includes(colKey)) {
          return asc ? numA - numB : numB - numA;
        }

        const comp = String(valA).localeCompare(String(valB));
        return asc ? comp : -comp;
      });
    }

    // 8. Auto-Scroll Schedule to Current Time at 5th Row
    function autoScrollScheduleToCurrentTime() {
      const now = new Date();
      const kstNow = new Date(now.getTime() + 9 * 3600 * 1000);
      const curTimeNum = parseInt(`${String(kstNow.getUTCHours()).padStart(2, '0')}${String(kstNow.getUTCMinutes()).padStart(2, '0')}`);

      ['dep', 'arr'].forEach(type => {
        const tbody = document.getElementById(`${type}-tbody`);
        const wrap = document.getElementById(`${type}-table-wrap`);
        if (!tbody || !wrap) return;

        const rows = Array.from(tbody.querySelectorAll('tr'));
        if (rows.length === 0) return;

        let matchIdx = 0;
        for (let i = 0; i < rows.length; i++) {
          const timeTd = type === 'dep' ? rows[i].children[7] : rows[i].children[8];
          const planTime = parseInt((timeTd?.textContent || '0000').replace(':', ''));
          if (planTime >= curTimeNum) {
            matchIdx = i;
            break;
          }
          matchIdx = i;
        }

        // Place current flight at the 5th visible position (index 4)
        const targetIdx = Math.max(0, matchIdx - 4);
        const targetRow = rows[targetIdx];
        if (targetRow) {
          wrap.scrollTop = targetRow.offsetTop - rows[0].offsetTop;
        }
      });
    }

    // 9. Fetch Flight Schedules via Gateway API
    async function syncFlightSchedules() {
      const spinDep = document.getElementById('spin-dep');
      const spinArr = document.getElementById('spin-arr');
      if (spinDep) spinDep.classList.add('active');
      if (spinArr) spinArr.classList.add('active');

      try {
        const res = await fetch(`${API_BASE}/api/flight-schedule?airport=${currentAirport}&_t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        loadedDeps = data.departures || [];
        loadedArrs = data.arrivals || [];

        // Exact completed departures vs total scheduled count
        const completedDepCount = loadedDeps.filter(d => (d.atd && d.atd !== '-' && d.atd !== '') || (d.sts||d.depStatus||'').toUpperCase().includes('DEP')).length;
        document.getElementById('dep-count').textContent = `[${completedDepCount}/${loadedDeps.length}]`;

        // Exact completed arrivals vs total scheduled count
        const completedArrCount = loadedArrs.filter(a => (a.ata && a.ata !== '-' && a.ata !== '') || (a.sts||a.arrStatus||'').toUpperCase().includes('ARR') || (a.sts||'').includes('LND')).length;
        document.getElementById('arr-count').textContent = `[${completedArrCount}/${loadedArrs.length}]`;

        renderScheduleTable('dep');
        renderScheduleTable('arr');

        // Auto-scroll to 5th row on initial airport load
        if (!hasAutoScrolledSchedule) {
          setTimeout(autoScrollScheduleToCurrentTime, 100);
          hasAutoScrolledSchedule = true;
        }

      } catch (e) {
        console.warn('Schedule sync error:', e.message);
      }

      if (spinDep) spinDep.classList.remove('active');
      if (spinArr) spinArr.classList.remove('active');
    }

    // 10. System Notices LocalStorage Management
    function loadAirportNotices(ap) {
      const saved = localStorage.getItem('ifs_notices_' + ap);
      const textarea = document.getElementById('notices-input');
      if (saved !== null) {
        textarea.value = saved;
      } else {
        textarea.value = DEFAULT_AIRPORT_NOTICES[ap] || `1. [${ap}] 표준 공역 감시 및 운항 통제 정상 유지 중.\n2. [NOTAM] 유효 비행고시보 실시간 동기화 완료.`;
      }
    }

    function saveCurrentNotices() {
      const textarea = document.getElementById('notices-input');
      localStorage.setItem('ifs_notices_' + currentAirport, textarea.value);
      
      const msg = document.getElementById('notice-save-msg');
      msg.style.display = 'inline';
      setTimeout(() => { msg.style.display = 'none'; }, 2000);
    }

    // 11. Sync System Heartbeat via API
    async function syncSystemStatus() {
      try {
        const crawlerRes = await fetch(`${API_BASE}/api/crawler?status=true&_t=${Date.now()}`);
        if (crawlerRes.ok) {
          document.getElementById('dot-gateway').style.background = 'var(--primary)';
        }
      } catch (e) {
        document.getElementById('dot-gateway').style.background = 'var(--red)';
      }
    }

    // Immediate Complete Purge & Step-by-Step Live DB Load on Airport Switch
    async function changeAirport(ap) {
      currentAirport = ap;
      rawRunwaysData = [];
      loadedDeps = [];
      loadedArrs = [];
      hasAutoScrolledSchedule = false;
      flightStatusHistory.clear();
      
      // 1. Immediately wipe previous airport contents completely to prevent confusion
      const wxContainer = document.getElementById('weather-runways-container');
      const depTbody = document.getElementById('dep-tbody');
      const arrTbody = document.getElementById('arr-tbody');

      if (wxContainer) wxContainer.innerHTML = '';
      if (depTbody) depTbody.innerHTML = '';
      if (arrTbody) arrTbody.innerHTML = '';
      
      document.getElementById('dep-count').textContent = '[0/0]';
      document.getElementById('arr-count').textContent = '[0/0]';

      ['line-met-report', 'line-metar', 'line-taf', 'line-sigmet', 'line-warning'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });

      // 2. Activate section spinners
      ['spin-wx', 'spin-met', 'spin-dep', 'spin-arr'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add('active');
      });

      loadAirportNotices(ap);
      
      // 3. Populate fresh data step-by-step
      await Promise.all([
        syncWeatherData(true),
        syncFlightSchedules(),
        syncSystemStatus()
      ]);
    }

    // Initial load & Periodic Pollers
    function init() {
      initThemeSettings();
      loadAirportNotices(currentAirport);
      syncWeatherData(true);
      syncFlightSchedules();
      syncSystemStatus();

      // Stable non-flickering background pollers
      setInterval(() => syncWeatherData(false), 10000);
      setInterval(syncFlightSchedules, 15000);
      setInterval(syncSystemStatus, 20000);
    }

    window.onload = init;
  </script>
</body>
</html>
